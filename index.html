<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phillip Sussman · Systems Administrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEF; --surface:#FFFFFF; --ink:#1E2124; --muted:#555B61; --line:#C9CDD1;
  --gun:#4E5052; --tag:#B3121F; --tag-ink:#FFFFFF; --link:#1F4E79;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1C1E; --surface:#24272A; --ink:#E6E8EA; --muted:#A3A9AF; --line:#3A3F44;
    --gun:#8C9196; --tag:#D3283A; --tag-ink:#FFFFFF; --link:#8DB8E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1C1E; --surface:#24272A; --ink:#E6E8EA; --muted:#A3A9AF; --line:#3A3F44;
  --gun:#8C9196; --tag:#D3283A; --tag-ink:#FFFFFF; --link:#8DB8E0;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--tag);outline-offset:3px;border-radius:2px}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.5rem}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}

/* hero */
header{padding:4.5rem 0 3rem;border-bottom:1px solid var(--line)}
.plate{display:inline-flex;gap:.75rem;align-items:center;color:var(--muted);font-weight:500;margin-bottom:1.25rem}
.plate span{border:1px solid var(--line);padding:.15rem .6rem;border-radius:3px;background:var(--surface)}
h1{font-size:clamp(3.2rem,11vw,6.5rem);letter-spacing:-.01em;color:var(--ink)}
.lede{max-width:40rem;font-size:1.25rem;color:var(--ink);margin:1.25rem 0 2rem}
.links{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 1.1rem;border:1px solid var(--ink);border-radius:4px;color:var(--ink);text-decoration:none;font-weight:600;background:transparent}
.btn:hover{background:var(--ink);color:var(--bg)}

section{padding:3.25rem 0;border-bottom:1px solid var(--line)}
section > h2{font-size:2.25rem;margin-bottom:1.75rem;color:var(--gun)}
